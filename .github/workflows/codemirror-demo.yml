# Publishes codemirror/demo-dist to GitHub Pages.
#
# Push to main only. A pull request from a fork runs with a read-only token and
# no access to the Pages environment, and this workflow gives it nothing extra:
# there is no `pull_request` trigger, and the write permissions below are on the
# deploy job rather than the file, so the build job cannot reach them either.
name: codemirror demo

on:
  push:
    branches: [main]
    paths:
      - 'codemirror/**'
      - '.github/workflows/codemirror-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and let a running one finish — a half-published Pages
# site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codemirror
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: codemirror/.nvmrc
          cache: npm
          cache-dependency-path: codemirror/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: codemirror/demo-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
