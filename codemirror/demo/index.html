<!doctype html>
<!-- Light unless the switch says otherwise, rather than following the system:
     the page exists to show the colours, and they read better on white. On the
     markup so there is no flash of the other theme before the script runs. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@lambada-llc/codemirror-lang-lambada</title>
    <!--
      Deliberately plain. The point of the page is to show what the package looks
      like, and a page with a look of its own is a second opinion about the same
      colours. So: system fonts, system colours, one border.
    -->
    <style>
      :root[data-theme='light'] {
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        background: Canvas;
        color: CanvasText;
        font: 13px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.7rem 1rem;
        border-bottom: 1px solid ButtonBorder;
      }
      h1 {
        margin: 0;
        font: 600 0.95rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #theme-toggle {
        margin-left: auto;
        padding: 0.35rem 0.7rem;
        border: 1px solid ButtonBorder;
        border-radius: 999px;
        background: ButtonFace;
        color: ButtonText;
        font: inherit;
        cursor: pointer;
      }

      main {
        display: grid;
        grid-template-columns: 1fr 22rem;
        min-height: 0;
      }
      #editor {
        overflow: auto;
        min-width: 0;
      }
      .cm-editor {
        height: 100%;
      }

      /* The controls, above the snippet they change. */
      aside {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 0;
        border-left: 1px solid ButtonBorder;
        background: ButtonFace;
      }
      /* A grid, so a second control is a second row. Each control is one label
         — the badge explaining it sits inside, at the end of the text. */
      #controls {
        display: grid;
        gap: 0.5rem;
        padding: 0.8rem 1rem;
        border-bottom: 1px solid ButtonBorder;
      }
      /* Block, not flex: a flex container makes an item of every element child,
         and the link and the badge belong to the sentence rather than beside
         it. Positioned because the tip below hangs off it. */
      label {
        position: relative;
        display: block;
        cursor: pointer;
      }
      /* Indented and dimmed while they apply, greyed out when they do not:
         both read a compilation, and there is none to read with compiling off. */
      label.nested {
        padding-left: 1.3rem;
      }
      label:has(input:disabled) {
        color: GrayText;
        cursor: default;
      }
      /* A line may break either side of an inline box, so the badge needs tying
         to the words it belongs to or it ends up alone on a line of its own. */
      .keep-together {
        white-space: nowrap;
      }
      /* A button, so that clicking it does not toggle the box — a label ignores
         clicks on interactive content — and so it is focusable without being
         told to be. Not GrayText, which is what made it near-invisible against
         a dark background; this stays a step off the text either way. */
      .info {
        margin-left: 0.15em;
        padding: 0;
        border: 0;
        background: none;
        color: color-mix(in srgb, CanvasText 60%, Canvas 40%);
        font: inherit;
        cursor: help;
      }
      .info:hover,
      .info:focus-visible {
        color: CanvasText;
      }
      /* The explanation, one hover away. Positioned against the label, which is
         the full width of the panel — the badge is a glyph somewhere in the
         middle of a sentence, and a box hung off it would sooner or later hang
         off the side of the page. */
      .tip {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        z-index: 1;
        padding: 0.5rem 0.6rem;
        border: 1px solid ButtonBorder;
        border-radius: 6px;
        background: Canvas;
        color: CanvasText;
        white-space: normal;
        /* Both off the button it lives in, which centres its text. */
        text-align: left;
        cursor: auto;
      }
      .info:hover > .tip,
      .info:focus-visible > .tip {
        display: block;
      }
      #snippet {
        margin: 0;
        padding: 0.8rem 1rem;
        overflow: auto;
        font: 0.75rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre;
      }

      @media (max-width: 46rem) {
        main {
          grid-template-columns: 1fr;
          grid-template-rows: 1fr auto;
        }
        aside {
          border-left: none;
          border-top: 1px solid ButtonBorder;
          max-height: 45vh;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>@lambada-llc/codemirror-lang-lambada</h1>
      <button id="theme-toggle" type="button" aria-live="polite"></button>
    </header>
    <main>
      <div id="editor"></div>
      <aside>
        <!-- The link and the badges sit inside their labels deliberately: a
             click on interactive content does not trigger the label, so they
             navigate and open rather than toggling the box. -->
        <div id="controls">
          <label>
            <input id="node-keys" type="checkbox" checked />
            Type △ with Alt-t, Alt-n, Ctrl-t or
            <span class="keep-together">Ctrl-n <button
              class="info"
              type="button"
              aria-label="Why this option is here"
            >ⓘ<span class="tip">
                Part of this package. Four bindings for one character, because
                which of them reaches the page depends on the OS and the
                browser. A host that knows what it is running on can name keys
                of its own instead — <code>nodeKeys: ['Mod-t']</code> — or
                <code>false</code> for none.
              </span></button></span>
          </label>
          <label>
            <input id="compile" type="checkbox" checked />
            Compile each statement and mark
            <span class="keep-together">it <button
              class="info"
              type="button"
              aria-label="Why this option is here"
            >ⓘ<span class="tip">
                Part of this package, and on by default: the compiler ships
                with it and runs on a worker started from a blob, so a host
                supplies nothing. Green compiled, red did not. Anything that
                reads a compilation is configured in here — there is nothing
                for it to read otherwise.
              </span></button></span>
          </label>
          <label class="nested">
            <input id="diagnostics" type="checkbox" checked />
            Report names nothing has
            <span class="keep-together">defined <button
              class="info"
              type="button"
              aria-label="Why this option is here"
            >ⓘ<span class="tip">
                Under the word itself. The compiler names what it could not
                resolve but not where it was, so the syntax tree is what turns
                the name back into a range — a name that was never written,
                because desugaring made it up, marks the statement instead.
              </span></button></span>
          </label>
          <label class="nested">
            <input id="previews" type="checkbox" checked />
            Show what an expression comes
            <span class="keep-together">to <button
              class="info"
              type="button"
              aria-label="Why this option is here"
            >ⓘ<span class="tip">
                A statement that is an expression rather than a definition gets
                evaluated, against everything defined above it, and the value
                appears at the end of the line. On a second worker: evaluating
                does not have to finish, and must not hold up the compiling
                that marks the document.
              </span></button></span>
          </label>
          <label class="nested">
            <input id="completions" type="checkbox" checked />
            Offer the names that are in
            <span class="keep-together">scope <button
              class="info"
              type="button"
              aria-label="Why this option is here"
            >ⓘ<span class="tip">
                Press Ctrl-Space in the editor. What is offered is whatever the
                statements above compiled to, so it grows as you define things
                — and only names anybody could have written, not the ones the
                compiler makes up on the way.
              </span></button></span>
          </label>
          <label>
            <input id="load-theme" type="checkbox" checked />
            Use <a href="https://github.com/craftzdog/cm6-themes">cm6-themes</a> by
            Takuya <span class="keep-together">Matsuyama (MIT) <button
              class="info"
              type="button"
              aria-label="Why this option is here"
            >ⓘ<span class="tip">
                Not part of this package: CodeMirror's default highlight style
                leaves some of the grammar's tags unpainted — operators and
                brackets — and a theme is how a host fills them in. Switch it off
                to see the difference.
              </span></button></span>
          </label>
        </div>
        <pre id="snippet"></pre>
      </aside>
    </main>
    <script>
      // The switch is the only thing that decides the theme — the page starts
      // light whatever the system says — so: the attribute, and a label saying
      // what pressing it would do.
      (() => {
        const root = document.documentElement;
        const toggle = document.querySelector('#theme-toggle');
        const update = () => {
          const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
          toggle.textContent = `Switch to ${next}`;
          toggle.setAttribute('aria-label', `Switch to ${next} theme`);
        };
        toggle.addEventListener('click', () => {
          root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
          update();
        });
        update();
      })();
    </script>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
