<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>@lambada-llc/codemirror-lang-lambada</title>
    <!--
      Deliberately plain. The point of the page is to show what the package looks
      like, and a page with a look of its own is a second opinion about the same
      colours. So: system fonts, one border colour, and nothing that could be
      mistaken for the editor.
    -->
    <style>
      :root {
        color-scheme: light dark;
      }
      :root[data-theme='light'] {
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        background: Canvas;
        color: CanvasText;
        font: 13px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      /* min-width so the header may be narrower than its contents rather than
         widening the page; the caption below is what gets narrowed. */
      header {
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
        flex-wrap: wrap;
        min-width: 0;
        padding: 0.7rem 1rem;
        border-bottom: 1px solid ButtonBorder;
      }
      header h1 {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 600;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      /* Takes what is left of the line and is clipped to it, so a caption too
         long to fit no longer pushes the switch onto a line of its own. */
      header p {
        margin: 0;
        color: GrayText;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #theme-toggle {
        margin-left: auto;
        border: 1px solid ButtonBorder;
        background: ButtonFace;
        color: ButtonText;
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        font: inherit;
        cursor: pointer;
      }
      #theme-toggle:hover {
        background: color-mix(in srgb, ButtonFace 82%, Canvas 18%);
      }

      main {
        display: grid;
        grid-template-columns: 1fr 22rem;
        min-height: 0;
      }

      #editor {
        overflow: auto;
        min-width: 0;
        min-height: 0;
      }
      #editor .cm-editor {
        height: 100%;
        color: CanvasText;
        background: Canvas;
      }
      #editor .cm-content {
        caret-color: CanvasText;
      }
      #editor .cm-cursor,
      #editor .cm-dropCursor {
        border-left-color: CanvasText;
      }
      #editor .cm-selectionLayer {
        display: none;
      }
      #editor .cm-content::selection,
      #editor .cm-content ::selection,
      #editor .cm-line::selection,
      #editor .cm-line ::selection {
        background: Highlight !important;
        color: HighlightText !important;
      }
      #editor .cm-activeLine,
      #editor .cm-activeLineGutter {
        background: color-mix(in srgb, CanvasText 8%, Canvas 92%);
      }
      #editor .cm-gutters {
        background: ButtonFace;
        color: GrayText;
        border-right: 1px solid ButtonBorder;
      }

      /* The controls, above the snippet they explain. */
      aside {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 0;
        border-left: 1px solid ButtonBorder;
        background: ButtonFace;
      }
      #controls {
        position: relative;
        display: flex;
        align-items: start;
        gap: 0.4rem;
        padding: 0.8rem 1rem;
        border-bottom: 1px solid ButtonBorder;
      }
      #controls label {
        display: flex;
        align-items: start;
        gap: 0.4rem;
        flex: 1;
        min-width: 0;
        cursor: pointer;
      }
      #controls input {
        margin: 0.15em 0 0;
      }

      /* Why the control is there, one hover away, so the control itself stays a
         single line of text. It sits at the end of the label's text and moves
         with it — a badge parked at the far edge of the row reads as belonging
         to the row rather than to the sentence. A button because clicking
         interactive content does not trigger the label, which is what keeps it
         from toggling the box, and because it is focusable without being told
         to be. The circle is drawn rather than borrowed from `ⓘ`, whose hairline
         all but disappears at this size. */
      .info {
        display: inline-grid;
        place-items: center;
        width: 1.3em;
        height: 1.3em;
        margin-left: 0.3em;
        padding: 0;
        vertical-align: -0.2em;
        border: 1px solid currentColor;
        border-radius: 50%;
        background: none;
        color: color-mix(in srgb, CanvasText 60%, Canvas 40%);
        font: 600 0.85em/1 inherit;
        font-family: inherit;
        cursor: help;
      }
      .info:hover,
      .info:focus-visible {
        color: CanvasText;
      }
      /* Positioned against #controls rather than the badge: the badge lands
         wherever the text leaves it, and a 17rem tip hung off it would sooner or
         later hang off the side of the page. */
      .tip {
        display: none;
        position: absolute;
        top: 100%;
        left: 1rem;
        right: 1rem;
        z-index: 1;
        padding: 0.5rem 0.6rem;
        border: 1px solid ButtonBorder;
        border-radius: 6px;
        background: Canvas;
        color: CanvasText;
        font-weight: 400;
        text-align: left;
        cursor: auto;
      }
      .info:hover > .tip,
      .info:focus-visible > .tip {
        display: block;
      }
      #snippet {
        margin: 0;
        padding: 0.8rem 1rem;
        overflow: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem;
        white-space: pre;
        tab-size: 2;
      }
      #status {
        padding: 0.35rem 1rem;
        border-top: 1px solid ButtonBorder;
        color: GrayText;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem;
      }

      @media (max-width: 46rem) {
        main {
          grid-template-columns: 1fr;
          grid-template-rows: 1fr auto;
        }
        aside {
          border-left: none;
          border-top: 1px solid ButtonBorder;
          max-height: 45vh;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>@lambada-llc/codemirror-lang-lambada</h1>
      <p>Stock CodeMirror plus <code>lambada()</code>, the package's one extension — the grammar so far. Nothing compiles anything.</p>
      <button id="theme-toggle" type="button" aria-live="polite"></button>
    </header>
    <main>
      <div id="editor"></div>
      <aside>
        <div id="controls">
          <!-- The link sits inside the label deliberately: a click on
               interactive content does not trigger the label, so it navigates
               rather than toggling the box. -->
          <label>
            <input id="load-theme" type="checkbox" checked />
            Use <a href="https://github.com/craftzdog/cm6-themes">cm6-themes</a>
            by Takuya Matsuyama (MIT)<button
              class="info"
              type="button"
              aria-label="Why this option is here"
            >
              i
              <span class="tip">
                Not part of this package: CodeMirror's default highlight style
                leaves some of the grammar's tags unpainted — operators and
                brackets — and a theme is how a host fills them in. Switch it off
                to see the difference.
              </span>
            </button>
          </label>
        </div>
        <pre id="snippet"></pre>
        <div id="status"></div>
      </aside>
    </main>
    <script>
      (() => {
        const root = document.documentElement;
        const toggle = document.querySelector('#theme-toggle');
        const media =
          typeof matchMedia == 'function'
            ? matchMedia('(prefers-color-scheme: dark)')
            : null;
        const systemTheme = () => (media && media.matches ? 'dark' : 'light');
        const effectiveTheme = () => root.dataset.theme || systemTheme();
        const updateToggle = () => {
          const theme = effectiveTheme();
          const nextTheme = theme === 'dark' ? 'light' : 'dark';
          toggle.textContent = `Switch to ${nextTheme}`;
          toggle.setAttribute('aria-label', `Switch to ${nextTheme} theme`);
        };

        toggle.addEventListener('click', () => {
          root.dataset.theme = effectiveTheme() === 'dark' ? 'light' : 'dark';
          updateToggle();
        });

        media && media.addEventListener('change', () => {
          if (!root.dataset.theme) updateToggle();
        });

        updateToggle();
      })();
    </script>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
