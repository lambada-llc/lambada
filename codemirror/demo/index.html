<!doctype html>
<!-- Light unless the switch says otherwise, rather than following the system:
     the page exists to show the colours, and they read better on white. On the
     markup so there is no flash of the other theme before the script runs. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>@lambada-llc/codemirror-lang-lambada</title>
    <!--
      Deliberately plain. The point of the page is to show what the package looks
      like, and a page with a look of its own is a second opinion about the same
      colours. So: system fonts, system colours, one border.
    -->
    <style>
      :root[data-theme='light'] {
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
      }
      /* Canvas and CanvasText are the only system colours every engine
         re-resolves when the page forces its scheme: WebKit keeps ButtonFace
         silver and ButtonBorder white whichever scheme is asked for, while
         ButtonText does follow it — which left the tabs white on near-white
         in the dark theme. So the surfaces and borders are mixed from the
         pair that adapts, and Button* appears nowhere below. */
      :root {
        --surface: color-mix(in srgb, CanvasText 8%, Canvas);
        --border: color-mix(in srgb, CanvasText 25%, Canvas);
      }

      * {
        box-sizing: border-box;
      }
      /* Pan only — also rules out double-tap zoom. */
      html {
        touch-action: pan-x pan-y;
        /* iOS Safari inflates text it deems too small — except inside
           contenteditable, which is how the read-only snippet ended up in a
           much larger font than the editable editor beside it. Pinned, so
           both panes show the size they were given. */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      /* Header, panes, options — top to bottom. Pinned to the viewport rather
         than sized by 100vh, which on iOS Safari is the height with the URL
         bar hidden — the page overflowed and scrolled while the bar was shown.
         Fixed like this the body always matches the visible viewport: header
         and footer sit on its edges, the middle row takes whatever they leave,
         and the editors scroll inside themselves while the page itself
         cannot. */
      body {
        margin: 0;
        position: fixed;
        inset: 0;
        overflow: hidden;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        background: Canvas;
        color: CanvasText;
        font: 13px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.7rem 1rem;
        border-bottom: 1px solid var(--border);
      }
      h1 {
        margin: 0;
        font: 600 0.95rem/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: nowrap;
      }
      /* Two buttons, one glyph each, one size: fixed circles rather than
         pills padded around their text, which made them a mismatched pair
         and left the title to wrap in what little room remained. */
      #insert-node,
      #theme-toggle {
        flex: none;
        inline-size: 2.1rem;
        block-size: 2.1rem;
        display: grid;
        place-items: center;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: var(--surface);
        color: CanvasText;
        font: inherit;
        font-size: 1.1rem;
        line-height: 1;
        cursor: pointer;
      }
      #insert-node {
        margin-left: auto;
      }

      main {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
      }
      /* The same two buttons twice over: captions when both panes are visible,
         tabs when the panes take turns. The columns match the panes below, so
         each caption sits over what it names. */
      #tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      #tabs button {
        padding: 0.45rem 1rem;
        border: 0;
        background: none;
        color: CanvasText;
        font: inherit;
        text-align: left;
        cursor: default;
      }
      #tabs button + button {
        border-left: 1px solid var(--border);
      }
      #panes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: minmax(0, 1fr);
      }
      #editor,
      #snippet {
        overflow: auto;
        min-width: 0;
      }
      #snippet {
        border-left: 1px solid var(--border);
      }
      .cm-editor {
        height: 100%;
      }

      /* The options, in a bar pinned under everything they change. Groups
         rather than one long list, so a wide screen lays them out beside each
         other and a narrow one stacks them back into a column. */
      #controls {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 0.5rem 2.5rem;
        padding: 0.8rem 1rem;
        border-top: 1px solid var(--border);
        background: var(--surface);
      }
      .group {
        display: grid;
        gap: 0.5rem;
      }
      /* Block, not flex: a flex container makes an item of every element child,
         and the link and the badge belong to the sentence rather than beside
         it. Positioned because the tip above hangs off it. */
      label {
        position: relative;
        display: block;
        cursor: pointer;
      }
      /* Indented and dimmed while they apply, greyed out when they do not:
         all of them read a compilation, and there is none to read with
         compiling off. */
      .nested {
        padding-left: 1.3rem;
      }
      label:has(input:disabled),
      #environment:has(input:disabled) {
        color: GrayText;
        cursor: default;
      }
      /* The modules, in a row: they are one option — what is in scope before
         the first line — rather than a stack of unrelated ones. Positioned for
         the same reason a label is, since the tip hangs off it. */
      #environment {
        position: relative;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.3rem 1rem;
      }
      #environment label {
        display: inline-flex;
        align-items: baseline;
        gap: 0.3rem;
      }
      /* Part of the sentence it ends rather than a control sitting beside it,
         and mixed from the same pair of system colours as every other surface
         here — Button* does not follow a forced colour scheme. */
      #preview-mode {
        margin: 0 0.15em;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--surface);
        color: CanvasText;
        font: inherit;
      }
      #preview-mode:disabled {
        color: GrayText;
      }
      /* A line may break either side of an inline box, so the badge needs tying
         to the words it belongs to or it ends up alone on a line of its own. */
      .keep-together {
        white-space: nowrap;
      }
      /* A button, so that clicking it does not toggle the box — a label ignores
         clicks on interactive content — and so it is focusable without being
         told to be. Not GrayText, which is what made it near-invisible against
         a dark background; this stays a step off the text either way. */
      .info {
        margin-left: 0.15em;
        padding: 0;
        border: 0;
        background: none;
        color: color-mix(in srgb, CanvasText 60%, Canvas 40%);
        font: inherit;
        cursor: help;
      }
      .info:hover,
      .info:focus-visible {
        color: CanvasText;
      }
      /* The explanation, one hover away. Positioned against the label, which is
         the full width of its group — the badge is a glyph somewhere in the
         middle of a sentence, and a box hung off it would sooner or later hang
         off the side of the page. Opens upward, over the editors: the bar sits
         on the bottom edge, so below it there is no page to open into. */
      .tip {
        display: none;
        position: absolute;
        bottom: 100%;
        left: 0;
        right: 0;
        z-index: 1;
        padding: 0.5rem 0.6rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: Canvas;
        color: CanvasText;
        white-space: normal;
        /* Both off the button it lives in, which centres its text. */
        text-align: left;
        cursor: auto;
      }
      .info:hover > .tip,
      .info:focus-visible > .tip {
        display: block;
      }

      @media (max-width: 46rem) {
        /* The row is already as short as its buttons; what a phone can still
           spare is the space around them. */
        header {
          padding: 0.45rem 0.75rem;
          gap: 0.5rem;
        }
        h1 {
          font-size: clamp(0.72rem, 3.2vw, 0.82rem);
          line-height: 1.2;
        }
        /* One pane at a time, and the buttons above turn from captions into
           the tabs that pick it. Canvas on the chosen one, so it reads as one
           piece with the pane it opens. */
        #tabs button {
          cursor: pointer;
        }
        #tabs button[aria-pressed='true'] {
          background: Canvas;
          font-weight: 600;
        }
        #panes {
          grid-template-columns: 1fr;
        }
        #panes[data-active='editor'] > #snippet,
        #panes[data-active='snippet'] > #editor {
          display: none;
        }
        #snippet {
          border-left: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>@lambada-llc/codemirror-lang-lambada</h1>
      <!-- The keys that insert △ all need a modifier, and a touch keyboard has
           none to hold, so on a phone this button is the only way to type one. -->
      <button id="insert-node" type="button" aria-label="Insert △" title="Insert △">
        △
      </button>
      <button id="theme-toggle" type="button"></button>
    </header>
    <main>
      <nav id="tabs">
        <button type="button" data-pane="editor" aria-pressed="true">
          Editor
        </button>
        <button type="button" data-pane="snippet" aria-pressed="false">
          The code that produces it
        </button>
      </nav>
      <div id="panes" data-active="editor">
        <div id="editor"></div>
        <div id="snippet"></div>
      </div>
    </main>
    <!-- The link and the badges sit inside their labels deliberately: a
         click on interactive content does not trigger the label, so they
         navigate and open rather than toggling the box. -->
    <footer id="controls">
      <div class="group">
        <label>
          <input id="node-keys" type="checkbox" checked />
          Type △ with Alt-t, Alt-n, Ctrl-t or
          <span class="keep-together">Ctrl-n <button
            class="info"
            type="button"
            aria-label="Why this option is here"
          >ⓘ<span class="tip">
              Part of this package. Four bindings for one character, because
              which of them reaches the page depends on the OS and the
              browser. A host that knows what it is running on can name keys
              of its own instead — <code>nodeKeys: ['Mod-t']</code> — or
              <code>false</code> for none.
            </span></button></span>
        </label>
      </div>
      <div class="group">
        <label>
          <input id="highlight-symbols" type="checkbox" checked />
          Highlight occurrences at the
          <span class="keep-together">cursor <button
            class="info"
            type="button"
            aria-label="Why this option is here"
          >ⓘ<span class="tip">
              Scope-aware, and works with compiling off too;
              <code>highlightSymbols: false</code> for none.
            </span></button></span>
        </label>
      </div>
      <div class="group">
        <label>
          <input id="compile" type="checkbox" checked />
          Compile each statement and mark
          <span class="keep-together">it <button
            class="info"
            type="button"
            aria-label="Why this option is here"
          >ⓘ<span class="tip">
              Part of this package, and on by default: the compiler ships
              with it and runs on a worker started from a blob, so a host
              supplies nothing. Green compiled, red did not. Anything that
              reads a compilation is configured in here — there is nothing
              for it to read otherwise.
            </span></button></span>
        </label>
        <label class="nested">
          <input id="diagnostics" type="checkbox" checked />
          Report undefined
          <span class="keep-together">references <button
            class="info"
            type="button"
            aria-label="Why this option is here"
          >ⓘ<span class="tip">
              Under the word itself. The compiler names what it could not
              resolve but not where it was, so the syntax tree is what turns
              the name back into a range — a name that was never written,
              because desugaring made it up, marks the statement instead.
            </span></button></span>
        </label>
        <label class="nested">
          <input id="previews" type="checkbox" checked />
          Evaluate expressions and show the result as
          <span class="keep-together"><select
            id="preview-mode"
            aria-label="What to show for a value"
          >
              <option value="inferred">what it looks like</option>
              <option value="tree">the tree itself</option>
              <option value="size">how big it is</option>
            </select> <button
            class="info"
            type="button"
            aria-label="Why this option is here"
          >ⓘ<span class="tip">
              A statement that is an expression rather than a definition gets
              evaluated, against everything defined above it, and the value
              lands at the end of the line. What a tree stands for is the
              host's to say: the package writes the tree itself and reads
              nothing into it, and a function in its place is handed the tree
              and answers with text or an element — which is what the other
              two settings here are. Guessing from the shape is a guess, and
              two booleans in a list really are the number they spell. On a
              second worker: evaluating does not have to finish, and must not
              hold up the compiling that marks the document.
            </span></button></span>
        </label>
        <label class="nested">
          <input id="completions" type="checkbox" checked />
          Auto-complete
          <span class="keep-together">names <button
            class="info"
            type="button"
            aria-label="Why this option is here"
          >ⓘ<span class="tip">
              Press Ctrl-Space in the editor. What is offered is whatever the
              statements above compiled to, so it grows as you define things
              — and only names anybody could have written, not the ones the
              compiler makes up on the way.
            </span></button></span>
        </label>
        <!-- One box per file in demo/env-dags, added by the script rather
             than written out here. -->
        <div id="environment" class="nested">
          <span>Definitions to put in
            <span class="keep-together">scope <button
            class="info"
            type="button"
            aria-label="Why this option is here"
          >ⓘ<span class="tip">
              The LambAda compiler merely desugars syntax and has no native
              "import" mechanism that would resolve modules from some registry
              or filesystem.
              In order to have access to symbols other than <code>△</code> (the
              only operator known to runtimes), the code codemirror component
              allows effectively prepending definitions, expected to be in
              exactly the format the LambAda compiler produces.
            </span></button></span></span>
        </div>
      </div>
      <div class="group">
        <label>
          <input id="load-theme" type="checkbox" checked />
          Use <a href="https://github.com/craftzdog/cm6-themes">cm6-themes</a> by
          Takuya <span class="keep-together">Matsuyama (MIT) <button
            class="info"
            type="button"
            aria-label="Why this option is here"
          >ⓘ<span class="tip">
              Not part of this package: CodeMirror's default highlight style
              leaves some of the grammar's tags unpainted — operators and
              brackets — and a theme is how a host fills them in. Switch it off
              to see the difference.
            </span></button></span>
        </label>
      </div>
    </footer>
    <script>
      // The switch is the only thing that decides the theme — the page starts
      // light whatever the system says — so: the attribute, and on the button
      // the theme pressing it would bring. A glyph rather than a sentence,
      // which on a phone was a two-line pill; the words live in the label and
      // the tooltip instead.
      (() => {
        const root = document.documentElement;
        const toggle = document.querySelector('#theme-toggle');
        const update = () => {
          const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
          toggle.textContent = next === 'light' ? '☀️' : '🌙';
          const label = `Switch to ${next} theme`;
          toggle.setAttribute('aria-label', label);
          toggle.setAttribute('title', label);
        };
        toggle.addEventListener('click', () => {
          root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
          update();
        });
        update();
      })();

      // On a narrow screen the panes share one space and these buttons choose
      // which of them has it; on a wide one both panes are visible and the
      // buttons are merely their captions. The choice is kept either way, so
      // narrowing the window shows whichever pane was picked last.
      (() => {
        const panes = document.querySelector('#panes');
        const tabs = [...document.querySelectorAll('#tabs button')];
        for (const tab of tabs)
          tab.addEventListener('click', () => {
            panes.dataset.active = tab.dataset.pane;
            for (const other of tabs)
              other.setAttribute('aria-pressed', String(other === tab));
          });
      })();
    </script>
    <script>
      // iOS ignores user-scalable=no for pinches; cancelling these stops them.
      for (const type of ['gesturestart', 'gesturechange', 'gestureend'])
        document.addEventListener(type, (event) => event.preventDefault());
    </script>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
